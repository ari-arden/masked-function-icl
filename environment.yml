name: masked-icl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pyyaml
  - pytest
  - pip:
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch==2.7.0
      - numpy<2
      - pandas>=2.0
      - matplotlib>=3.7
      - seaborn>=0.12
      - scikit-learn>=1.3
      - tqdm>=4.66
      - transformers==4.40.2
      - wandb>=0.16
      - xgboost>=1.7
      - reportlab>=4.0
