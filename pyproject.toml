[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "runs",
    "models",
    "checkpoints",
    "wandb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

